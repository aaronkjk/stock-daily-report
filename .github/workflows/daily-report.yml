name: daily-stock-report

on:
  schedule:
    # 23:00 UTC = 한국시간 08:00. (GitHub Actions 스케줄은 수 분 지연될 수 있음)
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # docs/index.html 커밋용

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build & send report
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY:  ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          REPORT_URL:          ${{ secrets.REPORT_URL }}
        run: python report.py

      - name: Commit report page
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html
          git commit -m "report: $(date -u +%Y-%m-%d)" || echo "no changes"
          git push
